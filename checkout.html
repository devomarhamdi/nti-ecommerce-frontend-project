<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar" class="navbar navbar-expand flex-wrap navbar-dark bg-dark px-3"></nav>

  <div class="container mt-4">
    <h3 class="mb-3">Checkout</h3>

    <div class="row g-4">
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm mb-3">
          <div class="card-body">
            <h5 class="mb-3">Shipping details</h5>
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="fullName" class="form-label">Full name</label>
                <input type="text" id="fullName" class="form-control">
              </div>
              <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" id="phone" class="form-control" placeholder="e.g. 01012345678">
              </div>
              <div class="col-12">
                <label for="address" class="form-label">Address</label>
                <input type="text" id="address" class="form-control">
              </div>
              <div class="col-12 col-md-6">
                <label for="city" class="form-label">City</label>
                <input type="text" id="city" class="form-control">
              </div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="mb-3">Payment</h5>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="payment" id="payCod" value="cod" checked>
              <label class="form-check-label" for="payCod">Cash on delivery</label>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="radio" name="payment" id="payPaypal" value="paypal">
              <label class="form-check-label" for="payPaypal">PayPal (sandbox)</label>
            </div>

            <div id="codArea">
              <button class="btn btn-primary" id="placeBtn">Place order</button>
            </div>
            <div id="paypalArea" class="d-none">
              <p class="small text-muted">Pay with a PayPal <strong>sandbox</strong> account. No real money is charged.</p>
              <div id="paypalButtons"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-5">
        <div class="card shadow-sm"><div class="card-body" id="summary"></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
