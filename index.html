<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar" class="navbar navbar-expand flex-wrap navbar-dark bg-dark px-3"></nav>

  <div class="container mt-4">
    <h3 class="mb-3">Products</h3>

    <!-- filters -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-12 col-md-6 col-lg-4">
            <label for="search" class="form-label small mb-1">Search</label>
            <input type="text" id="search" class="form-control" placeholder="Search by name or description">
          </div>
          <div class="col-12 col-md-6 col-lg-3">
            <label for="categoryFilter" class="form-label small mb-1">Category</label>
            <select id="categoryFilter" class="form-select"></select>
          </div>
          <div class="col-6 col-md-3 col-lg-2">
            <label for="minPrice" class="form-label small mb-1">Min price ($)</label>
            <input type="number" id="minPrice" class="form-control">
          </div>
          <div class="col-6 col-md-3 col-lg-3">
            <label for="maxPrice" class="form-label small mb-1">Max price ($)</label>
            <input type="number" id="maxPrice" class="form-control">
          </div>
          <div class="col-12 col-md-6 col-lg-4">
            <label for="sort" class="form-label small mb-1">Sort by</label>
            <select id="sort" class="form-select">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Name (A-Z)</option>
              <option value="rating">Top rated</option>
            </select>
          </div>
          <div class="col-12 col-md-6 col-lg-5 d-flex align-items-end justify-content-between gap-3">
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="inStock">
              <label class="form-check-label" for="inStock">In stock only</label>
            </div>
            <button class="btn btn-outline-secondary" id="resetBtn">Reset filters</button>
          </div>
        </div>
      </div>
    </div>

    <p class="text-muted small" id="resultCount"></p>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3" id="grid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
