<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar" class="navbar navbar-expand flex-wrap navbar-dark bg-dark px-3"></nav>

  <div class="container mt-5" style="max-width: 400px;">
    <div class="card p-4 shadow-sm">
      <h3>Login</h3>
      <p class="text-muted">Sign in to use your cart, wishlist and orders.</p>

      <div id="alert" class="alert d-none"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" id="email" class="form-control">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <p class="small mt-3 mb-1">New here? <a href="register.html">Create an account</a></p>
      <p class="small mb-1">Are you an admin? <a href="admin-login.html">Admin login</a></p>
      <p class="small text-muted mb-0">Demo customer: customer@shop.com / Customer@123</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
