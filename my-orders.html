<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My orders - Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar" class="navbar navbar-expand flex-wrap navbar-dark bg-dark px-3"></nav>

  <div class="container mt-4">
    <h3 class="mb-3">My orders</h3>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr><th>Order</th><th>Date</th><th class="text-center">Items</th><th class="text-end">Total</th><th>Status</th><th>Payment</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody id="table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Order details -->
  <div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>
  </div>

  <!-- Return request -->
  <div class="modal fade" id="returnModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="returnTitle">Request a return</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small">The whole order will be returned. An admin will review your request.</p>
          <div class="mb-3">
            <label for="reason" class="form-label">Reason</label>
            <select id="reason" class="form-select">
              <option value="">Select a reason</option>
              <option>Damaged or defective</option>
              <option>Wrong item received</option>
              <option>Not as described</option>
              <option>Changed my mind</option>
              <option>Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="details" class="form-label">Details</label>
            <textarea id="details" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" id="sendReturnBtn">Send request</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/my-orders.js"></script>
</body>
</html>
