<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar" class="navbar navbar-expand flex-wrap navbar-dark bg-dark px-3"></nav>

  <div class="container mt-5" style="max-width: 400px;">
    <div class="card p-4 shadow-sm">
      <h3>Create an account</h3>
      <p class="text-muted">Register as a customer to start shopping.</p>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Full name</label>
          <input type="text" id="name" class="form-control">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" id="email" class="form-control">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control">
          <div class="form-text">At least 8 characters, with a letter and a number.</div>
        </div>
        <div class="mb-3">
          <label for="confirm" class="form-label">Confirm password</label>
          <input type="password" id="confirm" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>

      <p class="small mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
